name: BSJP Telegram

on:
  schedule:
    - cron: "20 1 * * 1-5"
    - cron: "40 2 * * 1-5"
    - cron: "5 2-9 * * 1-5"
    - cron: "30 8 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto / pagi / cek / jam"
        required: false
        default: "auto"

jobs:
  kirim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kirim laporan ke Telegram
        run: python bsjp.py --telegram ${{ github.event.inputs.mode || 'auto' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGES_URL: https://sayurpagi21-stack.github.io/bsjp/
